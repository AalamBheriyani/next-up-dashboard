name = "next-up-dashboard"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Create with: npx wrangler kv namespace create NEXTUP_KV  (then paste the id here)
[[kv_namespaces]]
binding = "NEXTUP_KV"
id = "REPLACE_WITH_KV_ID"

# Queue between the dashboard and Claude Code on your laptop (free plan, SQLite-backed).
[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[vars]
# Public values. Private ones (email, sheet id, API keys) are set with `wrangler secret put`.
SITE_URL = "https://aalambheriyani.github.io/next-up-dashboard/"
WORKER_URL = "https://next-up-dashboard.REPLACE.workers.dev"
GOOGLE_CLIENT_ID = "REPLACE.apps.googleusercontent.com"
