# Every push to main gets a version number (a git tag like v0.4.2 and a GitHub Release with the
# changes; 0.x versions are marked as pre-releases), then publishes the website to GitHub Pages: the newest version at the root, and every
# earlier version at /v/<version>/ so any of them can be opened again later.
#
# Version bumps: patch by default (0.1.0, 0.1.1, ...). Put [minor] or [major] in a commit message (or run this workflow
# by hand and pick) to bump that part instead.
name: Site
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        type: choice
        options: [patch, minor, major]
        default: patch
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Renumber old 1.x versions as 0.x pre-releases (one-time; no-op once done)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --tags --force
          for t in $(git tag -l 'v1.*' --sort=v:refname); do
            IFS=. read -r ma mi pa <<<"${t#v}"
            n="v0.$((mi+1)).$pa"
            if ! git rev-parse -q --verify "refs/tags/$n" >/dev/null; then git tag "$n" "$t^{commit}"; git push origin "$n"; fi
            notes=$(gh release view "$t" --json body -q .body 2>/dev/null | sed "s#/v/$t/#/v/$n/#g" || true)
            gh release view "$n" >/dev/null 2>&1 || gh release create "$n" --title "$n" --verify-tag --prerelease --notes "${notes:-Renumbered from $t.}"
            gh release delete "$t" --yes --cleanup-tag 2>/dev/null || git push origin ":refs/tags/$t" || true
            git tag -d "$t"
          done
      - name: Version and release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_INPUT: ${{ inputs.bump }}
          BEFORE: ${{ github.event.before }}
        run: |
          git fetch --tags --force
          if git tag --points-at HEAD | grep -q '^v[0-9]'; then echo "HEAD already has a version"; exit 0; fi
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          msgs=$(git log --format=%B "${BEFORE:-HEAD~1}..HEAD" 2>/dev/null || git log -1 --format=%B)
          bump=${BUMP_INPUT:-patch}
          grep -qi '\[minor\]' <<<"$msgs" && bump=minor
          grep -qi '\[major\]' <<<"$msgs" && bump=major
          if [ -z "$last" ]; then next=v0.1.0; else
            IFS=. read -r ma mi pa <<<"${last#v}"
            case $bump in major) next="v$((ma+1)).0.0";; minor) next="v$ma.$((mi+1)).0";; *) next="v$ma.$mi.$((pa+1))";; esac
          fi
          git tag "$next" && git push origin "$next"
          if [ -n "$last" ]; then notes=$(git log --format='- %s' "$last..HEAD"); else notes=$(git log -20 --format='- %s'); fi
          printf '%s\n\nOpen this version: https://aalambheriyani.github.io/next-up-dashboard/v/%s/\n' "$notes" "$next" > notes.md
          # 0.x versions are pre-releases; from 1.0.0 on they become normal releases.
          if [[ $next == v0.* ]]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$next" --title "$next" --notes-file notes.md $kind
      - name: Build site with every version
        run: bash scripts/build-site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
