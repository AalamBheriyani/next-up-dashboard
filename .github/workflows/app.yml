# Builds the Next Up phone app (app/ folder).
# Android: a signed APK (when the signing secrets are set) attached to the "app-latest" release on main.
# iOS: an unsigned build to check it compiles; installing on a device needs Apple signing (see app/README.md).
name: App builds

on:
  push:
    paths: ["app/**", "core/**", "webapp/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "core/**", "webapp/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Shared code (core/)
        working-directory: core
        run: flutter pub get && flutter analyze && flutter test
      - name: Flutter website (webapp/)
        working-directory: webapp
        run: flutter pub get && flutter analyze && flutter test && flutter build web --release --no-web-resources-cdn
  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - name: Write signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing secrets: building with the debug key."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with: { name: next-up-android, path: app/build/app/outputs/flutter-apk/app-release.apk }
      - name: Publish to the app-latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk next-up.apk
          gh release view app-latest >/dev/null 2>&1 || gh release create app-latest --prerelease --title "Next Up app (latest)" --notes "Latest Android build from main. Install next-up.apk on your phone."
          gh release upload app-latest next-up.apk --clobber

  ios:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
